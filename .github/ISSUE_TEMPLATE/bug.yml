name: Bug report
description: Something does not work
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
  - type: textarea
    id: output
    attributes:
      label: Output or error message
      render: text
  - type: input
    id: env
    attributes:
      label: OS, Python version, Bambu Studio version
